# APIs.io OpenAPI conventions — the authored half of scripts/harden-openapi.mjs.
#
# The contracts in openapi/ are generated. Everything a human decided about them
# lives here, keyed so one entry serves every contract that carries the shape:
# a property description written once for `Meta.total` lands in the nine
# contracts that expose a paginated collection.
#
# Provenance for the measured entries — probed against the live API 2026-09-03:
#   - gated calls answer 402 (GET /ratings, /compare, /insights/company/{slug}/gaps,
#     /areas/{slug}/leaders all 402 keyless); 403 is never returned.
#   - every response carries ratelimit-policy, x-ratelimit-tier,
#     x-ratelimit-limit and x-ratelimit-window.
#   - search-api.apis.io is NXDOMAIN, which is why /search/apis is dropped.

info:
  contact:
    name: API Evangelist
    url: https://apis.io
    email: info@apievangelist.com
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  # /refine-openapis derives a title from the filename and mangled two of them.
  titles:
    apis-io-apis-api-openapi.yml: APIs.io APIs API
    apis-io-search-api-openapi.yml: APIs.io Search API
  summaries: {}
  descriptions: {}

# One production host. The path-level overrides the merge introduced pointed at
# search-api.apis.io, which no longer resolves.
servers:
  - url: https://apis.io/api/v1
    description: Production server.

tags:
  Search: Unified search across the APIs.io catalog — apis, providers, tags and artifacts from one endpoint.

# Rate-limit headers every apis.io response actually carries. Measured, not
# assumed: curl -D - against a 200, a 404 and a 402 all returned all four.
headers:
  attach: [ratelimit-policy, x-ratelimit-tier, x-ratelimit-limit, x-ratelimit-window]
  names:
    ratelimit-policy: RateLimitPolicy
    x-ratelimit-tier: RateLimitTier
    x-ratelimit-limit: RateLimitLimit
    x-ratelimit-window: RateLimitWindow
  components:
    RateLimitPolicy:
      description: The quota and burst policy applied to this key, in the RFC 9745 RateLimit-Policy form.
      schema:
        type: string
        maxLength: 1024
      example: '"quota";q=500;w=86400, "burst";q=5;w=1'
    RateLimitTier:
      description: The tier the call was served at. Keyless callers are served `free`.
      schema:
        type: string
        enum: [free, pro, business]
      example: free
    RateLimitLimit:
      description: Requests allowed in the current quota window.
      schema:
        type: integer
        maximum: 1000000
      example: 500
    RateLimitWindow:
      description: Length of the quota window, in seconds.
      schema:
        type: integer
        maximum: 1000000
      example: 86400

securityScheme:
  name: ApiKeyAuth
  definition:
    type: apiKey
    in: header
    name: X-API-Key
    description: >-
      Send a plan key to be served above the free tier. Keyless callers get the free tier;
      a call that needs a paid tier answers 402 rather than refusing the connection.

# The dead half of the search contract. search-api.apis.io is NXDOMAIN, and the
# same paths on apis.io/api/v1 return the unified-search payload, not the
# APIs.json submit/search shapes these operations documented.
dropPaths:
  apis-io-search-api-openapi.yml:
    - /search/apis

# Once the legacy half is gone the _2 suffixes the merge created are free.
renames:
  apis-io-search-api-openapi.yml:
    schemas:
      Link_2: Link
      Tag_2: Tag
      Meta_2: Meta
      Problem_2: Problem
    responses:
      BadRequest_2: BadRequest
    parameters:
      Limit_2: Limit
      Page_2: Page

# operationId -> the MCP tool that serves the same call. apis.io ships an MCP
# server whose tools map 1:1 to operations; a missing x-mcp-tool is a hole in
# that map, not an operation without a tool.
mcpTools:
  listApis: find_apis
  getApi: get_api
  listOpenapis: find_openapis
  listAsyncapis: find_asyncapis
  listArazzo: find_arazzo
  listPostman: find_postman
  listCollections: find_collections
  listGraphql: find_graphql
  listJsonSchemas: find_json_schemas
  listJsonStructures: find_json_structures
  listJsonLd: find_json_ld
  listRules: find_rules
  listExamples: find_examples
  listFinops: find_finops
  listPlans: find_plans
  listRateLimits: find_rate_limits
  getInsightsSummary: insights_overview
  listInsightIndustries: insights_industries
  listProviders: find_providers
  getProvider: get_provider
  listProviderApis: get_provider_apis
  getRatingRubric: get_rating_rubric
  search: apis_io_search
  listTags: find_tags
  getTag: get_tag

# Operations that never declared one. Every apis.io operation is callable
# keyless — a gated one answers 402 rather than refusing — so the network-wide
# convention is an empty requirement. The saved workspace is the exception and
# already declares ApiKeyAuth on all ten of its operations.
security: {}

# Measured 2026-09-03: every one of these answered 402 keyless while its
# contract said free. The gating matches the platform's own published tier map
# (synthesis surfaces — insights, cohorts, resolve/enrich, the VC graph — need a
# plan); the per-operation stamps had lagged behind it.
tiers:
  getInsightsSummary: pro
  listInsightDimensions: pro
  listInsightAdoption: pro
  listInsightIndustries: pro
  listInsightCompanies: pro
  getCompanyInsight: pro
  listVcs: pro
  getVc: pro
  getVcPortfolio: pro
  listCohorts: pro
  getCohort: pro
  resolveIdentifier: pro
  enrichProvider: pro

# Copy corrected by the same measurements — sentences that promise Free where
# the live API answers 402. Exact substrings, replaced wherever they appear in
# the named contract.
copyFixes:
  apis-io-insights-api-openapi.yml:
    - ["Discovery is free; per-company depth, gaps, and provider matches are Pro.", "Pro — from the overview down to per-company depth, gaps, and provider matches."]
    - ["the top investment dimensions across the profiled set. Free.", "the top investment dimensions across the profiled set. Pro."]
    - ["ranked by how many companies show signal. Free.", "ranked by how many companies show signal. Pro."]
    - ["ranked by how many companies adopt them. Free.", "ranked by how many companies adopt them. Pro."]
    - ["Profiled sectors with company counts. Free.", "Profiled sectors with company counts. Pro."]
    - ["filter by name. Free (top-line fields).", "filter by name. Pro."]
    - ["Free returns a thin preview; Pro returns the full 40-dimension profile", "Pro — the full 40-dimension profile"]
  apis-io-venture-capital-api-openapi.yml:
    - ["follow the reverse edge from a provider to the VCs that back it. Free discovery.", "follow the reverse edge from a provider to the VCs that back it. Pro, except the per-provider investor lookup."]
    - ["sort by portfolio_on_network (default), portfolio_total, portfolio_rating, or name. Free.", "sort by portfolio_on_network (default), portfolio_total, portfolio_rating, or name. Pro."]
    - ["Pass view=full to inline the full portfolio graph. Free.", "Pass view=full to inline the full portfolio graph. Pro."]
    - ["sort by score (default), api_count, or name. Free.", "sort by score (default), api_count, or name. Pro."]
  apis-io-cohorts-api-openapi.yml:
    - ["Free: knowing a cohort exists is discovery.", "Pro."]
    - ["the gap is a coverage fact, not a rounding error. Free.", "the gap is a coverage fact, not a rounding error. Pro."]
  apis-io-resolve-enrich-api-openapi.yml:
    - ["choosing field groups. Free (the rating and insights enrichment groups are Pro).", "choosing field groups. Pro."]
    - ["Use when you hold a URL, not a slug. Free.", "Use when you hold a URL, not a slug. Pro."]

# Shared error components, created where a contract needs one it never carried.
# The unreachability prune drops any template nothing references.
componentTemplates:
  Problem:
    type: object
    description: 'A Problem Details object per [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457), served as `application/problem+json`.'
    properties:
      type:
        type: string
        format: uri
        default: about:blank
        description: A URI identifying the problem type; dereferences to human-readable docs.
        examples: ['https://apis.io/problems/invalid-parameter']
        maxLength: 2048
      title:
        type: string
        description: A short, human-readable summary of the problem type.
        examples: [Invalid parameter]
        maxLength: 1024
      status:
        type: integer
        minimum: 100
        maximum: 599
        description: The HTTP status code, repeated for convenience.
        examples: [400]
      detail:
        type: string
        description: A human-readable explanation specific to this occurrence.
        maxLength: 20000
      instance:
        type: string
        format: uri-reference
        description: A URI reference identifying the specific occurrence (typically the request path).
        maxLength: 2048
      parameter:
        type: string
        description: Extension member — the offending query/path parameter, when applicable.
        maxLength: 1024
    required: [type, title, status]
    additionalProperties: true
  UpgradeRequired:
    description: Payment Required — this operation needs a paid tier. Send a plan key in `X-API-Key`.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/Problem'
        example:
          type: https://apis.io/problems/upgrade-required
          title: Upgrade required
          status: 402
          detail: This endpoint requires the Understanding or Influence plan.
          instance: /v1/ratings
  NotFound:
    description: Resource not found.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/Problem'
        example:
          type: https://apis.io/problems/not-found
          title: Resource not found
          status: 404
          detail: No API found with aid `twilio:nope`.
          instance: /v1/apis/twilio:nope
  BadRequest:
    description: Malformed request (bad parameter value).
    content:
      application/problem+json:
        schema:
          $ref: '#/components/schemas/Problem'
        example:
          type: https://apis.io/problems/invalid-parameter
          title: Invalid parameter
          status: 400
          detail: '`match` must be one of: any, all.'
          instance: /v1/search
          parameter: match

# The two shared failure responses still answering in plain application/json.
# They move to problem+json + the Problem schema; their extension members live
# on in the example (legal per RFC 9457 — Problem is additionalProperties: true).
responseConversions:
  InsufficientPopulation:
    description: The cohort has too few scored members for distribution statistics to be meaningful. Carries `member_count`, `minimum` and `available` extension members; the roster and capability matrix remain available.
    example:
      type: https://apis.io/problems/insufficient-population
      title: Insufficient population
      status: 422
      detail: This cohort holds 3 scored members; distribution statistics need 5.
      instance: /v1/cohorts/tag/quantum-computing/stats
      member_count: 3
      minimum: 5
      available: [roster, capabilities]
  AuthRequired:
    description: The saved workspace needs a signed-in apis.io API key — get one at https://apis.io/developer/.
    example:
      type: https://apis.io/problems/auth-required
      title: Authentication required
      status: 401
      detail: The saved workspace needs a signed-in apis.io API key. Get one at https://apis.io/developer/.
      instance: /v1/me/lists

operationDescriptions:
  listLists: The saved lists in your workspace, each with its members and when it was last changed. Requires a signed-in apis.io API key.

parameterDescriptions:
  path:dataset: The dataset to export.
  path:id: Identifier of the saved search or list, as returned when it was created.
  path:slug: Slug of the company, as it appears on its apis.io page.
  query:action_class: Filter operations by what class of action they perform.
  query:band: Filter to companies in this rating band.
  query:category: Filter firms by category.
  query:in_network: Only portfolio companies already profiled on the network.
  query:limit: Items per page.
  query:method: Filter operations by HTTP method.
  query:min_score: Only results at or above this composite score.
  query:page: 1-based page number.
  query:provenance: Filter tools by whether the provider published them or the network derived them.
  query:sort: Sort order.
  query:view: How much of the record to return.

# A parameter or a string field with no upper bound is an unbounded field on the
# wire. These are the ceilings the rest of the contracts already use.
parameterBounds:
  stringMaxLength: 1024
  integerMaximum: 1000000
  numberMaximum: 1000000
  arrayMaxItems: 1000

requestBodies:
  post /me/searches: The search to save — a name plus the filters the search runs with.
  post /me/lists: The list to create — a name and, optionally, its first members.
  post /me/lists/{id}/entries: The members to add to the list.

responseDescriptions:
  '200': Success.
  '201': Created.
  '400': Malformed request (bad parameter value).
  '401': No API key was sent, or it is not valid.
  '402': This operation needs a paid tier.
  '404': Resource not found.
  '422': Not enough population to compute a result.
  '429': Rate limit exceeded.
  '500': Server error.

# Forced onto the component responses, because 403 -> 402 changed what the
# example has to say.
responseOverrides:
  UpgradeRequired:
    description: Payment Required — this operation needs a paid tier. Send a plan key in `X-API-Key`.
    example:
      type: https://apis.io/problems/upgrade-required
      title: Upgrade required
      status: 402
      detail: This endpoint requires the Understanding or Influence plan.
      instance: /v1/ratings

responseExamples:
  BadRequest:
    type: https://apis.io/problems/invalid-parameter
    title: Invalid parameter
    status: 400
    detail: '`match` must be one of: any, all.'
    instance: /v1/search
    parameter: match
  NotFound:
    type: https://apis.io/problems/not-found
    title: Resource not found
    status: 404
    detail: No API found with aid `twilio:nope`.
    instance: /v1/apis/twilio:nope
  AuthRequired:
    type: https://apis.io/problems/auth-required
    title: Authentication required
    status: 401
    detail: The saved workspace needs a signed-in apis.io API key. Get one at https://apis.io/developer/.
    instance: /v1/me/lists
  InsufficientPopulation:
    type: https://apis.io/problems/insufficient-population
    title: Insufficient population
    status: 422
    detail: This cohort holds too few scored providers to rank.
    instance: /v1/cohorts/industry/quantum-computing/rankings

# Component schema descriptions and, where the merge dropped it, the type.
schemas:
  ApiList: {description: A page of APIs, with the pagination metadata for the query that produced it., type: object}
  AreaList: {description: A page of curated areas, with the pagination metadata for the query that produced it., type: object}
  ArtifactList: {description: A page of artifacts, with the pagination metadata for the query that produced it., type: object}
  IndustryList: {description: A page of industries, with the pagination metadata for the query that produced it., type: object}
  ProviderList: {description: A page of providers, with the pagination metadata for the query that produced it., type: object}
  RatingList: {description: A page of rated providers, ranked, with the pagination metadata for the query that produced it., type: object}
  RegionList: {description: A page of regions, with the pagination metadata for the query that produced it., type: object}
  TagList: {description: A page of tags, with the pagination metadata for the query that produced it., type: object}
  Link: {description: A named link off a provider or API — its documentation, pricing page, status page, repository, and so on., type: object}
  TagRef: {description: A pointer to another tag in the taxonomy, by slug and display name., type: object}
  SearchResults: {description: A page of search results of the requested kind, with the pagination metadata for the query that produced it., type: object}
  Meta: {description: Pagination and echoed-query metadata for collection responses., type: object}
  Problem: {description: 'A Problem Details object per [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457), served as `application/problem+json`.', type: object}
  Rubric: {description: The published Kin Score rubric — the facets that make up a composite score, their weights, and the bands the score falls into., type: object}
  Trend: {description: Which way a provider's composite score has moved since the previous scoring run., type: object}
  Facets: {description: The six facets that compose a Kin Score, each scored 0-100., type: object}
  Band: {description: Rating band derived from the composite score., type: string}
  Artifact: {description: One machine-readable artifact published by a provider — an OpenAPI, a Postman collection, a pricing page, an MCP server definition., type: object}
  ArtifactType: {description: The kind of artifact, from the APIs.io artifact-type vocabulary., type: string}
  RankedProvider: {description: A provider summary as it appears in an industry, region or area membership list., type: object}
  RatingEntry: {description: One provider's place in the ranked ratings table., type: object}
  ProviderScore: {description: A provider's Kin Score — the composite, its facets, the band it falls in, and how it moved., type: object}
  FacetName: {description: The name of one Kin Score facet., type: string}

# Property copy, keyed <SchemaName>.<property>. `description` fills a missing
# description; `example` becomes `examples: [value]` when the property has
# neither. Values are real catalog values, not invented ones.
properties:
  # Copy the first lint pass surfaced as still missing.
  Area.slug: {description: Slug of the area, as it appears in its site URL., example: authentication}
  Area.name: {description: Display name of the area., example: Authentication}
  Area.short: {description: One-line summary of the area., example: Identity, keys, tokens and the sign-in surface of an API.}
  Industry.slug: {description: Slug of the industry, as it appears on its apis.io page., example: artificial-intelligence}
  Industry.name: {description: Display name of the industry., example: Artificial Intelligence}
  Industry.short: {description: One-line summary of the industry., example: Model providers, ML platforms, and AI-native applications.}
  Region.slug: {description: Slug of the region, as it appears on its apis.io page., example: north-america}
  Region.name: {description: Display name of the region., example: North America}
  Region.short: {description: One-line summary of the region., example: Companies headquartered in the United States and Canada.}
  Tag.slug: {description: Slug of the tag, as it appears on its apis.io page., example: messaging}
  Tag.name: {description: Display name of the tag., example: Messaging}
  Tag.apis: {description: APIs carrying this tag.}
  Provider.slug: {description: Slug of the company, as it appears on its apis.io page., example: twilio}
  ProviderScore.schema_version: {description: Version of the scoring rubric this score was computed under., example: '0.3'}
  Rubric.schema_version: {description: Version of this rubric., example: '0.3'}
  Api.overview: {description: A longer editorial overview of the API, where one has been written., example: The account-management surface of the Twilio platform — subaccounts, auth tokens, and account-level resources.}
