specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: APIs.io
providerId: apis-io
created: '2026-05-04'
# HARVESTED 2026-08-21 from the provider's own published surface, replacing the
# 2026-05-04 bulk-sweep scaffold. That scaffold was not merely unverified, it was
# WRONG about a paid product in every dimension:
#
#            scaffold said                    truth
#   tiers    Free / Professional / Enterprise Free / Starter / Pro / Business
#   free     10 requests per MINUTE           5 requests per SECOND
#   free     1,000 per MONTH                  1,000 per DAY
#   pro      100,000 per MONTH                100,000 per DAY
#   price    absent / "TBD"                   $0, $0, $49/mo, $199/mo
#   domain   https://search-api.apis.io       https://apis.io/api/v1 (the old host is NXDOMAIN)
#
# Ground truth is the enforced configuration, not any page: the numbers below are
# the API Gateway usage plans in apis-io-aws/lib/apis-io-stack.js, which agree
# exactly with https://apis.io/developer/plans. Note the /developer/rate-limits
# page contradicted BOTH, claiming "there are no per-key quotas in v1" -- it has
# been corrected in the same pass.
method: harvested
modified: '2026-08-21'
tags:
  - API Aggregation
  - API Directory
  - API Discovery
  - API Indexing
  - API Rating
  - API Search
  - APIs.json
  - Search Engine
description: >-
  Published plans and pricing for the APIs.io API. Four customer tiers, all metered per API key at
  the gateway with a per-second rate limit and a rolling daily quota. Free and Starter cost nothing;
  Starter requires a GitHub sign-in. Paid tiers raise the limits and unlock industries, regions,
  ratings, Insights depth and the Saved Workspace. Gated resources answer 402 rather than 403.
x-source:
  - https://apis.io/developer/plans
  - https://apis.io/developer/account
  - apis-io-aws/lib/apis-io-stack.js (API Gateway usage plans — the enforced values)
x-enforced-by: AWS API Gateway usage plans, keyed on x-api-key via the request authorizer
x-gated-response: 402
plans:
  - id: apis-io-free
    name: Free
    type: freemium
    description: >-
      Keyless default. Every request without a key is metered on this tier. Discovery, search and
      browse across the catalog; the rated, industry, region and Insights-depth surfaces answer 402.
    entries:
      - label: Rate Limit
        description: Sustained requests per second, per API key
        name: rate_limit
        type: rate
        metric: requests_per_second
        limit: 5
        timeFrame: second
        geo: global
        domains: [https://apis.io/api/v1]
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Burst
        description: Short-term burst ceiling before throttling
        name: burst
        type: rate
        metric: requests_per_second
        limit: 10
        timeFrame: second
        geo: global
        domains: [https://apis.io/api/v1]
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Daily Quota
        description: Requests per rolling day, per API key
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: day
        geo: global
        domains: [https://apis.io/api/v1]
        unit: 1
        price: '0.00'
        userMultiplied: false
