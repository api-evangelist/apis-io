notes:
- >-
  The graph has one hub (Provider) and three orthogonal grouping dimensions (Tag, Industry/Region,
  Area). Artifact is the leaf that carries every machine-readable document, keyed to both Api and
  Provider so it can be queried from either side.
- >-
  Insights is a second, demand-side graph whose only edge into the supply-side graph is the
  provider-match operation.
