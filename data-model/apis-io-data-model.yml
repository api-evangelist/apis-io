method: derived
source: openapi/_original/apis-io-v1-openapi.yml
docs: https://apis.io/developer/overview
identifiers:
  provider: slug — lowercase kebab, e.g. `twilio`
  api: 'aid — `<provider-slug>:<api-slug>`, e.g. `twilio:twilio-accounts-api`'
  tag: slug
  industry: slug
  region: slug
  area: slug
  company_insight: slug
entities:
- name: Provider
  description: An organization publishing APIs on the network. The root entity of the catalog.
  key: slug
  path: /providers/{slug}
  fields: [slug, name, description, api_count, image, created, common, apis, tags, score]
- name: Api
  description: One published API belonging to a provider.
  key: aid
  path: /apis/{aid}
  fields: [aid, name, description, provider_slug, provider_name, baseURL, humanURL, tags,
    properties, sibling_apis, overview]
- name: Artifact
  description: >-
    One machine-readable document published against an API (OpenAPI, AsyncAPI, Postman, Arazzo,
    JSON Schema, JSON-LD, GraphQL, rules, scopes, security, plans, rate-limits, finops, …).
  key: id
  path: /apis/{aid}/artifacts
  fields: [id, type, name, url, aid, provider_slug, provider_name, content, content_type]
- name: Link
  description: A typed link-property on a provider (`common[]`) — the apis.yml property model.
  key: type+url
  fields: [type, url, title]
- name: Tag
  description: A topic tag with network-wide ranking metadata.
  key: slug
  path: /tags/{slug}
  fields: [slug, name, composite, band, frequency, breadth, quality_lift, provider_count,
    api_count, variants, neighbors, providers, apis]
- name: Industry
  description: An industry vertical grouping providers.
  key: slug
  path: /industries/{slug}
  fields: [slug, name, short, description, aliases, provider_count, api_count, providers]
- name: Region
  description: A macro sales region grouping providers.
  key: slug
  path: /regions/{slug}
  fields: [slug, name, short, description, aliases, name_patterns, provider_count, api_count,
    providers]
- name: Area
  description: A curated topical collection of providers, each with its own site.
  key: slug
  path: /areas/{slug}
  fields: [slug, name, short, description, aliases, area_url, area_host, icon, provider_count,
    api_count, providers]
- name: ProviderScore
  description: A provider's Kin Score — composite, band, trend, delta and the six facet scores.
  path: /providers/{slug}/rating
  fields: [composite, band, trend, delta, previous_composite, scored_at, schema_version, facets]
- name: RatingEntry
  description: One row of the ranked ratings leaderboard.
  path: /ratings
  fields: [rank, provider_slug, provider_name, composite, band, trend, facets]
- name: Facets
  description: The six weighted facets of the composite score.
  fields: [discoverability, contract_quality, governance, operational_transparency,
    developer_ergonomics, commercial_clarity]
- name: Rubric
  description: The scoring rubric — bands, facet weights and trend thresholds.
  path: /ratings/rubric
  fields: [schema_version, bands, facets, trending]
- name: CompanyInsight
  description: >-
    A demand-side company profile derived from job postings, press and engineering blogs — the
    join partner for the supply-side provider graph.
  key: slug
  path: /insights/company/{slug}
