rate_limit_signaling:
  headers:
  - RateLimit-Policy
  - X-RateLimit-Limit
  - X-RateLimit-Window
  - X-RateLimit-Tier
  cors_exposed: >-
    access-control-expose-headers lists ratelimit-policy, x-ratelimit-limit, x-ratelimit-window,
    x-ratelimit-tier and www-authenticate, so a browser client can read them too.
  observed_example:
    request: GET https://apis.io/api/v1/search?q=weather&limit=1 (anonymous, no key)
    ratelimit-policy: '"quota";q=500;w=86400, "burst";q=5;w=1'
    x-ratelimit-limit: 500
    x-ratelimit-window: 86400
    x-ratelimit-tier: free
  retry_after: not sent
  remaining: not sent
  note: >-
    CORRECTED 2026-09-11. This block previously read "headers: none observed", which was true on
    2026-08-10. The API now signals its limits on every response, including anonymous ones, in the
    RFC-draft RateLimit-Policy form plus three X-RateLimit-* headers. What it still does NOT send
    is a remaining-count or a Retry-After, so an agent can read the ceiling and its tier from any
    response but cannot see how close it is to the ceiling until it hits it. Over-quota Pro
    surfaces return HTTP 402 upgrade_required rather than 429.
  divergence: >-
    The observed anonymous quota is q=500;w=86400 (500/day). plans/apis-io-plans-pricing.yml and
    https://apis.io/developer/plans both state a Free daily quota of 1,000. Recorded, not
    reconciled — the header is what the gateway enforces on an unkeyed caller and the published
    number may describe a keyed Free account.
  artifact: rate-limits/apis-io-rate-limits.yml
