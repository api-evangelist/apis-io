standards:
- id: openapi-3.1
  conforms: true
  evidence: >-
    Every spec in openapi/ declares openapi 3.1.0. Across the 19 tag-split contracts in
    openapi/_original/ there are 110 distinct operationIds (302 GET, 32 POST, 7 DELETE counted
    with duplicates across the aggregate and the splits); the v1 aggregate carried 62 on
    2026-08-10.
- id: apis-json-0.21
  conforms: true
  evidence: >-
    https://apis.io/apis.json returns specificationVersion 0.21 (HTTP 200); the catalog is built on
    the APIs.json format.
- id: rfc9727-api-catalog
  conforms: true
  evidence: >-
    /.well-known/api-catalog returns HTTP 200 application/linkset+json with service-desc,
    service-doc and describedby relations.
- id: rfc8615-well-known
  conforms: true
  evidence: api-catalog, mcp/server-card.json and agent-skills/index.json served under /.well-known/.
- id: llms-txt
  conforms: true
  evidence: https://apis.io/llms.txt returns HTTP 200 text/plain in llms.txt format.
- id: mcp-2025-11-05
  conforms: true
  evidence: >-
    Streamable-HTTP MCP server at https://apis.io/mcp; anonymous tools/list returned 200 with 133
    tools on 2026-09-11 (79 on 2026-08-10); initialize reports protocolVersion 2025-06-18 and
    server version 1.3.0; server card declares schemaVersion 2025-11-05. The card still describes
    the server as read-only at version 1.2.0 while the live server ships 17 write-shaped tools —
    a card/server divergence recorded in mcp/apis-io-mcp.yml.
- id: agent-skills-discovery-0.2.0
  conforms: true
  evidence: >-
    /.well-known/agent-skills/index.json validates against the Cloudflare Agent Skills Discovery
    RFC v0.2.0 index schema; 20 skills with sha256 digests on 2026-09-11 (10 on 2026-08-10). All
    twenty SKILL.md files re-fetched at HTTP 200 and saved verbatim under skills/.
- id: aipref-content-usage
  conforms: true
  evidence: 'robots.txt carries Content-Usage: search=y, ai-input=y, ai-train=y.'
- id: cloudflare-content-signals
  conforms: true
  evidence: 'robots.txt carries Content-Signal: search=yes, ai-input=yes, ai-train=yes.'
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Declared in the contract (components.schemas.Problem, application/problem+json) but not served
    — live 404 returns application/json {"error","detail"}. See errors/apis-io-problem-types.yml.
- id: rfc9116-security-txt
  conforms: true
  evidence: >-
    https://apis.io/.well-known/security.txt returns HTTP 200 text/plain (2026-09-11) with
    Contact, Expires, Preferred-Languages, Canonical and Policy. Expires is rendered at build time
    six months out so the mandatory field cannot lapse. Was 404 on 2026-08-10.
  changed: '2026-09-11'
- id: rfc8594-sunset-header
  conforms: partial
  evidence: >-
    CORRECTED 2026-09-11. A published deprecation policy DOES exist at
    https://apis.io/developer/deprecation (HTTP 200, last modified 2026-08-21) committing to RFC
    8594 Sunset and RFC 9745 Deprecation headers plus a Link rel="deprecation", with 6-month
    (endpoint/field) and 12-month (version) minimum notice. Marked partial rather than true
    because no header can be observed: nothing in the contract is currently deprecated, so no
    response carries one. The 2026-08-10 entry said "no published deprecation policy", which was
    wrong.
  changed: '2026-09-11'
- id: rfc9745-deprecation-header
  conforms: partial
  evidence: Committed in the same policy; unobservable for the same reason — no operation is currently deprecated.
- id: oauth2
  conforms: true
  evidence: >-
    RFC 6749/OAuth 2.1 authorization server at issuer https://apis.io — RFC 8414 metadata at
    /.well-known/oauth-authorization-server (HTTP 200, 2026-09-11), authorization/token/registration
    endpoints under /api/v1/auth/, scopes apis:read, apis:pro, offline_access. Was false on
    2026-08-10, when the document 404'd.
  changed: '2026-09-11'
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: /.well-known/oauth-authorization-server returns HTTP 200 application/json with issuer, jwks_uri and all three endpoints.
- id: rfc9728-protected-resource-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns HTTP 200 naming resource https://apis.io/mcp,
    authorization_servers [https://apis.io], scopes_supported [apis:read] and
    bearer_methods_supported [header].
- id: rfc7591-dynamic-client-registration
  conforms: true
  evidence: >-
    registration_endpoint https://apis.io/api/v1/auth/register is advertised in both the RFC 8414
    and OIDC discovery documents, with token_endpoint_auth_methods_supported including "none".
- id: rfc7636-pkce
  conforms: true
  evidence: code_challenge_methods_supported is ["S256"] — S256 only, no plain.
- id: rfc8707-resource-indicators
  conforms: true
  evidence: resource_indicators_supported is true in the authorization-server metadata.
- id: aauth-resource
  conforms: true
  evidence: >-
    /.well-known/aauth-resource.json returns HTTP 200 carrying both required fields (issuer,
    jwks_uri) plus an r3_vocabularies map (Rich Resource Requests) pointing
    urn:aauth:vocabulary:mcp at https://apis.io/mcp. First probed 2026-09-11.
  caveat: >-
    The same map points urn:aauth:vocabulary:openapi at https://apis.io/openapi.json, which
    returned HTTP 404 on the same pass. The document conforms structurally; one of the two
    vocabulary URIs it advertises does not resolve.
- id: rfc9421-http-message-signatures
  conforms: false
  evidence: >-
    /.well-known/http-message-signatures-directory IS served (HTTP 200) but its keys[] array is
    empty by design — the document itself states apis.io does not sign outbound HTTP traffic. A
    present directory with no keys is not a signing posture.
- id: api-onboarding-descriptor-0.1
  conforms: true
  evidence: >-
    /.well-known/api-onboarding returns HTTP 200, aod 0.1, describing the account, verification,
    registration, authentication and credential steps from cold start to an authorized call.
- id: openid-connect
  conforms: true
  evidence: >-
    /.well-known/openid-configuration returns HTTP 200 (2026-09-11) with issuer, jwks_uri,
    authorization/token/registration endpoints, response_types_supported [code], grant_types
    [authorization_code, refresh_token, client_credentials] and S256 PKCE. Was 404 on 2026-08-10.
  changed: '2026-09-11'
  caveat: >-
    The document is byte-identical to the RFC 8414 one and advertises no id_token issuance
    (no subject_types_supported, no id_token_signing_alg_values_supported), so this is OAuth
    metadata served at the OIDC path rather than a full OpenID Provider.
- id: a2a-agent-card
  conforms: partial
  evidence: >-
    /.well-known/agent-card.json returns HTTP 200 application/json (served since 2026-09-07; 404
    on 2026-08-10). Graded NEAR-CONFORMANT against A2A 1.0.0 in a2a/apis-io-a2a.yml: all three
    hard checks pass, but preferredTransport is "MCP" — not a transport A2A defines — and url
    points at an MCP endpoint, so an A2A client can parse the card and cannot drive the service
    with it. The pre-0.3 /.well-known/agent.json alias is still 404.
  changed: '2026-09-11'
- id: asyncapi
  conforms: false
  evidence: >-
    No event or webhook surface — the API is read-only and publishes no AsyncAPI. Not applicable
    rather than deficient.
