compliance_program:
  published: false
  certifications: []
  note: >-
    APIs.io publishes no trust centre and claims no SOC 2 / ISO 27001 / PCI DSS / HIPAA
    certification. The page at https://apis.io/security/ is the catalog's cross-provider "API
    Security Posture" index — it lists OTHER providers' certifications and must not be read as an
    APIs.io compliance claim.
domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY and deliberately left empty. APIs.io's market is API discovery, and the closest
    thing to a domain standard for it is APIs.json — which IS declared, and is already recorded
    above as apis-json-0.21 with a live /apis.json at HTTP 200 rather than as a marketing claim.
    Nothing else in this sector has a standard to conform to, so no slot is filled to fill it.
