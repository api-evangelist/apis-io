  # GRADED near-conformant, NOT conformant, and the distinction is deliberate.
  #
  # All three hard checks pass and every top-level key is an A2A key — there are no invented
  # fields. But `preferredTransport: MCP` is not a transport A2A defines, and `url` points at an
  # MCP endpoint rather than an A2A one. An A2A client can PARSE this card and cannot DRIVE this
  # service with it, which is more than a naming deviation.
  #
  # This is our own listing, scored with the rubric we sell, on the one dimension the rubric says
  # cannot be derived on a provider's behalf. Grading it `conformant` because the structure is
  # clean would be exactly the flattery the dimension exists to prevent.
  deviations:
  - id: no-native-a2a-endpoint
    detail: >-
      APIs.io serves no A2A JSON-RPC endpoint. The card describes the interfaces the service
      actually offers — MCP at /mcp and REST at /api/v1 — and says so in the interface
      description rather than advertising an endpoint that does not exist.
  - id: nonstandard-preferred-transport
    detail: >-
      preferredTransport is "MCP", which A2A does not define. The honest value for a service that
      does not speak A2A; a defined one would name a transport we do not serve.
  - id: no-pre-0.3-alias
    detail: >-
      /.well-known/agent.json is not served. Clients pinned to the pre-0.3 path find nothing.
  - id: subdomain-probes-miss
