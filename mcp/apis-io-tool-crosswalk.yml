notes:
- >-
  The MCP surface is a strict superset of REST on the stateful side (Saved Workspace, lists) and on
  the venture-capital and resolver surfaces; REST is a superset on the Insights rollups. Neither is
  a projection of the other, which is why both are recorded.
- >-
  Pro-tier tools appear in an anonymous tools/list but return HTTP 402 `upgrade_required` when
  called without a paid key — the tool list is not an entitlement list.
