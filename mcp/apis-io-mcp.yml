  source_operation: openapi/_original/apis-io-v1-ratings-openapi.yml#getProviderEvidence
  first_seen: '2026-09-11'
- name: get_rating_rubric
  description: 'UNDERSTANDING — the rubric: bands, facet weights, trend thresholds, so an agent can interpret
