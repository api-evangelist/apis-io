    included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#recommendStack
- name: get_provider_apis
  description: 'Every API one provider publishes, as a page you can filter — the provider''s own catalog
    rather than the whole network''s. Prefer this over find_apis with a `providers` filter when you already
    know the company: it is the endpoint the provider page itself is built from, so `meta.total` is that
