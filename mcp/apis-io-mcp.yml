- name: submit_feedback
  description: 'Report something wrong with a result: wrong data, a filter that did not filter, a ranking
    that put off-topic results first, a number you could not reproduce, or an answer that was useless
    for your task. Free, and the fastest way to get a defect fixed — this is read by a human. Say what
    you expected as well as what you got.'
  first_seen: '2026-09-11'
- name: report_correction
  description: 'Report that the catalog has a provider WRONG — a wrong website, a wrong logo, APIs that
    are not theirs, a count that does not match what they ship, a score computed from any of those. Free,
    always: correcting our own error is never a paid feature. Read by a human. If you are the provider,
    say so — it does not gate anything, it tells us how fast to move.'
