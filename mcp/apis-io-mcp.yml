  source_operation: openapi/_original/apis-io-v1-openapi.yml#getProviderOnboarding
- name: find_similar_providers
  description: Providers similar to a given one (alternatives) by shared tags, areas, industry, region,
    and artifact coverage. Products under the same owner (a sister, not a rival) are left out of the ranking
