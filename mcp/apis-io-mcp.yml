  source_operation: openapi/_original/apis-io-v1-openapi.yml#whatsChanged
- name: recommend_stack
  description: Design an API stack — the best-rated catalog provider per capability, assembled into a
    stack. The Understanding preview is the top pick per capability; the full answer adds alternatives,
    per-pick artifact gaps, and an exportable APIs.json + Arazzo hint. Decompose the domain into capabilities
