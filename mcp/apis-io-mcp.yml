    B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence.
    See apis://prices.
  first_seen: '2026-09-11'
- name: get_area_leaders
  description: UNDERSTANDING — Top-rated providers in a curated API Evangelist area. Priced B1 (single-entity
    synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getAreaLeaders
- name: get_rating_history
  description: 'UNDERSTANDING — A provider''s REAL score time series: one point per scored build (composite
    + agent readiness on each date), plus a summary of the movement over the window — first/last, net
    change, direction, and the largest single-build jump with the date it happened. Not an implied previous
    point; these are the recorded snapshots. Priced B1 (single-entity synthesis) — $0.01 per call under
    pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getRatingHistory
- name: find_rating_movers
  description: UNDERSTANDING — The biggest rating movers (up and down) since the previous scoring build.
    Priced per result — $0.005 per request plus $0.0002 per record returned (less past 100), capped at
    $0.50 a request, under pay-as-you-go; included in Understanding and Influence. Estimate first at /api/v1/prices/estimate.
    See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#findRatingMovers
- name: story_leads
  description: 'OWNER — The weekly "what''s worth writing" rollup: ranked story leads from the demand
    map crossed with rating movement — unmet demand (searched, no result), risers/fallers, and hot-but-thin
    capabilities. Each lead is a headline, its signal, and a suggested angle. include=["raw"] appends
    the underlying demand report. Not purchasable: owner-only, at any price.'
  note: MCP-only.
- name: what_can_i_fix
  description: INFLUENCE — the ranked, gated punch list for one provider you own. Every agent-readiness
    check with points still on the table (exact — these are real per-check results, each with what satisfies
    it), plus the Kin Score facets ranked by weight x headroom rather than by lowest score. `do_first`
    is the headline and prefers a BAND GATE over any amount of points, because points cannot clear a gate.
    Use readiness_gates for the gate detail and simulate_fixes to price a plan before committing to it.
    Priced B2 (cross-catalog synthesis) — $0.05 per call under pay-as-you-go; included in Understanding
    and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#whatCanIFix
  first_seen: '2026-09-11'
- name: readiness_gates
  description: 'INFLUENCE — what blocks the next agent-readiness band, GATES BEFORE POINTS. Some bands
    are unreachable on score alone: agent-native requires idempotency AND a stable error envelope regardless
    of how many points a provider collects. Returns the points gap and the unmet gate requirements separately,
    each priced, plus a verdict saying whether clearing the gate also closes the gap — the case a points-arithmetic
    answer gets wrong every time. Priced B2 (cross-catalog synthesis) — $0.05 per call under pay-as-you-go;
    included in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#readinessGates
  first_seen: '2026-09-11'
- name: simulate_fixes
  description: 'INFLUENCE — project a set of fixes onto a provider''s agent-readiness score and band before
    doing the work. Re-applies the band gate to the PROJECTED state, so it will tell you when buying points
    still leaves you demoted. Kin Score facets are refused rather than estimated: several checks behind
    them are count-based across a provider''s APIs, so a single claimed fix has no computable composite
    value. Priced B2 (cross-catalog synthesis) — $0.05 per call under pay-as-you-go; included in Understanding
    and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#simulateFixes
  first_seen: '2026-09-11'
- name: claim_listing
  description: 'INFLUENCE — ask to claim a listing as yours. Returns 202 with a token and the hosts it
    will be checked against: publish it as a DNS TXT record, or as a file at /.well-known/apis-io-challenge,
    and leave it up. A PERSON verifies it and emails you — there is nothing else to call. Track it with
    check_status. Priced B4 (human work) — worked by a person, no charge. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#claimListing
  first_seen: '2026-09-11'
- name: generate_artifact
  description: 'INFLUENCE — REQUEST an artifact you are being marked down for not having: apis-json, agent-card,
    mcp (one tool per operation you already publish), arazzo, rules (a Spectral ruleset scoped to your
    own failing checks), scopes and security (read out of your own OpenAPI). Returns 202 — a person generates
    it against your live surface, checks it, and sends it to you. Nothing is published on your behalf
    either way: your score moves when YOU commit the file. Omit `artifact` to list what can be made. Priced
    B4 (human work) — included in Influence; otherwise $49.00 as a one-off with its own receipt, never
    from a prepaid balance. If this is your own company and our data about it is wrong, report_correction
    is free. See apis://prices.'
  first_seen: '2026-09-11'
- name: submit_artifact
  description: INFLUENCE — tell us about an artifact you publish, rather than waiting for us to find it.
    Returns 202; a person fetches it, checks it and re-runs the pipeline against it. Track it with check_status.
    Priced B4 (human work) — included in Influence; otherwise $49.00 as a one-off with its own receipt,
    never from a prepaid balance. If this is your own company and our data about it is wrong, report_correction
    is free. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#submitArtifact
  first_seen: '2026-09-11'
- name: correct_facts
  description: 'INFLUENCE — propose corrections to what we say about you: name, description, url, industries,
    tags. Returns 202 and is applied by a person — an API that let an owner rewrite their own description
    unreviewed would be a marketing surface, not a catalog. Score and band are not owner-settable and
    are ignored. Priced B4 (human work) — included in Influence; otherwise $49.00 as a one-off with its
    own receipt, never from a prepaid balance. If this is your own company and our data about it is wrong,
    report_correction is free. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#correctFacts
  first_seen: '2026-09-11'
- name: dispute_finding
  description: INFLUENCE — "you say we lack X, here it is." Send the claim in words and a URL that evidences
    it. Returns 202; a person fetches your evidence, checks it against what we hold, and emails you either
    way. Open to any paying caller — you should not have to prove ownership before you can tell us our
    data is wrong. Priced B4 (human work) — included in Influence; otherwise $49.00 as a one-off with
    its own receipt, never from a prepaid balance. If this is your own company and our data about it is
    wrong, report_correction is free. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#disputeFinding
  first_seen: '2026-09-11'
- name: set_visibility
  description: 'INFLUENCE — ask to be shown less, or not at all. `restricted` keeps a name, a description
    and a link to your own site, unrated and out of every ranked view; `delisted` removes you entirely.
    Returns 202 and is applied by a person: it strips artifacts, pages and rollups across the network,
    which is not something to do irreversibly on one API call. Priced B4 (human work) — worked by a person,
    no charge. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#setVisibility
  first_seen: '2026-09-11'
- name: watch_listing
  description: 'INFLUENCE — be told when a listing you care about moves: score changes, band changes,
    agent-band changes, or a check closing. REQUIRES a destination: `contact` (an email address), `callback_url`
    (an https endpoint that receives signed JSON), or both. The first pass after registering records where
    the provider stands and sends nothing, so the first notification you get is about a real move. `agent_band`
    is the one worth having — it carries the gate that caused the change, which a provider cannot compute
    about themselves. Re-registering the same slug REPLACES its event set rather than adding a second
    watch. list_watches shows what you hold; unwatch_listing removes one. Priced B1 (single-entity synthesis)
    — $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: list_watches
  description: 'INFLUENCE — the listings you are watching, with the events registered for each and when
    you started. The read half of watch_listing: call it before registering another, so you neither duplicate
    a watch nor assume one is in place that never took. Priced B1 (single-entity synthesis) — $0.01 per
    call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: unwatch_listing
  description: INFLUENCE — stop watching a listing. Takes effect immediately and removes the registration
    outright; there is no paused state. Removing a watch that was never registered is not an error. Priced
    B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence.
    See apis://prices.
  first_seen: '2026-09-11'
- name: request_check
  description: 'INFLUENCE — ask APIs.io to (re)check something. Use it when a listing is wrong or stale,
    when a score looks incorrect, or to get a company profiled that is not in the catalog yet. A check
    can target a PROVIDER (the default) or a slice of the catalog: an `industry`, a `tag`, an `area`,
    or a company''s `estate` — for an industry roster missing an obvious member, a tag that has drifted,
    or an area whose ranking looks wrong. This does NOT score anything on the spot: a check means re-running
    the enrichment pipeline against the live surface, which a person does by hand. You get a request id
    back immediately; poll check_status with it, and if you supply a contact email you are notified when
    the status changes. A slug we do not already hold is never refused — for ANY target type it is queued
    as a request to ADD that thing, whether that is a company nobody has catalogued, a new industry, or
    an estate nobody here has thought of. Near matches come back alongside it in `did_you_mean`, so a
    typo is visible without the request being dropped. Priced B4 (human work) — included in Influence;
    otherwise $99.00 as a one-off with its own receipt, never from a prepaid balance. If this is your
    own company and our data about it is wrong, report_correction is free. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#requestCheck
  first_seen: '2026-09-11'
- name: check_status
  description: 'INFLUENCE — the status of a check request by id: queued, in_review, running, done, rejected
    or needs_info, with any notes shared by the reviewer. The id identifies the request, but the Influence
    plan is now required to read it back. To report an error for free, use report_correction or open an
    issue on the provider''s api-evangelist repo. Priced B1 (single-entity synthesis) — $0.01 per call
    under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: find_agents
  description: 'FREE, no account — the A2A agent registry: agents that registered THEMSELVES by serving
    an agent card and calling register_agent. Each row carries the card URL, the operator, and the last
    verification of the card (grade, protocol version, transport). This is the door an unattended agent
    can walk through unaided; the others need a person or a voucher.'
- name: register_agent
  description: 'FREE, no account — register yourself in the A2A agent registry. Serve an agent card at
    /.well-known/agent-card.json on a host you control, then call this with its URL (or just the host).
    The card must be fetchable and pass the three A2A 1.0.0 hard checks: capabilities is an object, protocolVersion
    is present, skills is an array. 202 queues it for review; 422 says exactly which check failed. The
    card IS the evidence, so there is no form, no account, and nothing to wait for from us.'
- name: report_gap
  description: 'FREE, no account — tell the catalog what you looked for and could not find. The consumer
    door (roadmap#166): a gap report is how the catalog learns what to add next, and a person reads the
    queue. One required field.'
  source_operation: openapi/_original/apis-io-v1-provider-control-openapi.yml#reportGap
  first_seen: '2026-09-11'
- name: my_checks
  description: INFLUENCE — the check requests you filed, newest first. Requires a key or login — an anonymous
    caller has no identity to scope a list to, and should read a single request with check_status instead.
    Priced B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go; included in Understanding
    and Influence. See apis://prices.
  first_seen: '2026-09-11'
- name: export_dataset
  description: 'LICENCE (sold on the Influence plan) — the WHOLE dataset, not a 100-row page: `ratings`
    (every rated provider with facets, trend, rubric + provenance), `providers` (the catalog with coverage
    + score), or `history` (every provider''s full score time series — parallel date/composite/agent_readiness
    arrays across every scored build the catalog retains, with a movement summary per provider). `history`
    is the one nobody can reconstruct after the fact: it is the only record of what the catalog looked
    like on those dates. For media outlets and analysts licensing the data to publish rankings and trends.
    Every dataset exceeds one response, so they arrive in byte-budgeted chunks: while `complete` is false,
    call again with `cursor` set to `next_cursor` and concatenate `data`; the last page has `complete:
    true` and a null `next_cursor`. Attribute to apis.io and cite the rubric. Priced B3 (bulk export)
    — $0.002 per row, $0.50 minimum per call under pay-as-you-go; included in Understanding and Influence.
    See apis://prices.'
  note: MCP-only.
- name: industry_gap_analysis
  description: UNDERSTANDING — Valuable artifact types (MCP, Arazzo, Rules, Skills…) commonly missing
    across a whole industry — where the vertical is under-served. Priced B2 (cross-catalog synthesis)
    — $0.05 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#industryGapAnalysis
- name: export_stack
  description: UNDERSTANDING — Export a designed capability stack as an adoptable APIs.json document (with
    an Arazzo hint) the team can commit. Priced B3 (bulk export) — $0.002 per row, $0.50 minimum per call
    under pay-as-you-go; included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#exportStack
- name: insights_overview
  description: 'UNDERSTANDING — the Insights root: how many companies are profiled, over how many quarters,
    and the top investment dimensions across the whole set. Read this FIRST — it tells you the size and
    vintage of the corpus before you draw a conclusion from any single company in it. Priced B2 (cross-catalog
    synthesis) — $0.05 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: find_company_insights
  description: Browse profiled companies (Fortune 1000) by name or industry; ranked by overall technology-readiness
