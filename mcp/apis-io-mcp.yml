- name: insights_industries
  description: 'UNDERSTANDING — the demand-side industry rollup: the sectors the profiled companies fall
    into. Each row carries TWO counts and they answer different questions: `company_count` is the research
    roster, `profiled_count` is how many of those you can actually read back via find_company_insights(industry:)
    — size a cohort on profiled_count. The counterpart to find_industries, which counts SUPPLY (providers
    publishing APIs into a vertical) — this counts DEMAND (companies buying into it). Comparing the two
    is how you find a sector with buyers and no sellers. Priced B2 (cross-catalog synthesis) — $0.05 per
    call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
