tools:
- name: apis_io_search
  description: 'START HERE. Federated overview of the APIs.io catalog for a query: the top matching APIs,
    providers, AND tags in one call, each with its total match count. Filter by tags, artifact types,
    industry, region, rating band. `limit` is per section. To page/sort the full list of ONE type, use
    find_apis / find_providers / find_tags; for one entity, get_api / get_provider.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#search
- name: get_prices
  description: 'What one call costs on the pay-as-you-go plan, by cost band. FREE — and deliberately so:
    an agent that learns a price only when it is refused has already been refused by its own wallet. Call
    this BEFORE budgeting a run of paid tools. Returns the bands (free catalog reads, single-entity synthesis,
    cross-catalog synthesis, per-row bulk) and every priced resource key. Under an Understanding or Influence
    subscription these calls are included in the plan; these prices are what per-call access costs. The
    same map prices x402 payments and the x-price-usd header, so all three agree.'
- name: get_playground_apis
  description: 'Curated APIs that are SAFE TO EXPERIMENT WITH — no key (or an instant, free, self-serve
    key), no cost, and no real-world side effects. Free, and deliberately so: this is where you start
    if you are new here. Every entry carries an `example_request` URL that returned HTTP 200 to an unauthenticated
    GET on the date shown, so it can be called immediately with no setup. Use this when you are new to
    this catalog, learning what an API call feels like, testing a tool-use loop, or need a harmless endpoint
    to demonstrate something. Defaults to the `starter` set; pass grouping="deep-archive" for institutional/OAI-PMH
    repositories.'
  first_seen: '2026-09-11'
- name: find_apis
  description: 'Paginated, sortable list of APIs across providers — filter by tag, provider, artifact
    type, industry, region, or rating band. Matching is LEXICAL: `q` searches the API''s own name and
    description. apis_io_search reports a larger API total for the same `q` because it also counts every
    API belonging to a provider whose NAME matched; pass include=["via_provider"] here to get that same
    union, and `meta.query.via_provider` says how many rows it added. Use apis_io_search first for a cross-type
    overview.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listApis
- name: get_api
  description: 'Full detail for one API by aid (provider:api-slug); set include=["content"] to inline
    artifact bodies. Results carry `next`: the sub-resources that exist for this entity and the exact
    tool call that retrieves each, computed from this record. Pass include_next=false to omit it.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getApi
- name: find_providers
  description: 'Paginated, sortable list of providers — filter by text, tag, artifact type, industry,
    region, rating band, access model (pricing/onboarding/try_now/public), or DIRECTION (accepts_writes/min_acting
    — whether the surface takes a write or only emits). `tags` filters on what the COMPANY does (its own
    top-level classification), not on what its endpoints touch; for a resource-level term use find_apis?tags=,
    or api_tags= here to find companies whose APIs merely touch it. A row that is a third-party marketplace
    / app-store / directory LISTING rather than the provider (`x_source: marketplace-listing`) ranks after
    every provider; meta.query.marketplace_listings_demoted says how many. Name it in `providers` to read
    it where you put it. Use apis_io_search first for a cross-type overview.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listProviders
- name: get_provider
  description: 'Full detail for one provider: profile, rating, and the APIs it publishes. The heavy `collections`
    and `common` sections are omitted by default (their counts are still reported) — pass view=full for
    the whole document, or fields=["common"] for a section. Narrow for cheap reads: fields=["score"] returns
    just the rating. Relative artifact URLs are resolved to absolute, fetchable ones. Results carry `next`:
    the sub-resources that exist for this entity and the exact tool call that retrieves each, computed
    from this record. Pass include_next=false to omit it.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getProvider
- name: find_tags
  description: Paginated, sortable list of tags in the taxonomy. Filter by `axis` to separate MARKETS
    (a business someone is in) from CAPABILITIES (the name of a resource in somebody's OpenAPI) — the
    single most useful distinction in the vocabulary, and a coin flip without it. A tag can carry more
    than one axis, so axis=market means market is ONE of its axes. Use apis_io_search first for a cross-type
    overview.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listTags
- name: get_tag
  description: 'One tag: its metadata, neighbor tags, and a top sample of its providers and APIs (with
    totals). `provider_count` counts companies that classify THEMSELVES here; `api_provider_count` counts
    the ones reached only through an API or operation tag — the two are disjoint, and a tag with no providers
    and many APIs names a resource, not a market. `age` summarises when the members were created (created_last_30d/90d,
    the largest same-day batch, and how much of the first page by composite is under 30 days old) — a
    high first_page share means the top of the tag is new listings, and find_providers(tags, sort:"created")
    lists them newest first. Use find_apis?tags=slug / find_providers?tags=slug for the full ranked list,
    or view=full here. Results carry `next`: the sub-resources that exist for this entity and the exact
    tool call that retrieves each, computed from this record. Pass include_next=false to omit it.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getTag
- name: find_industries
  description: Browse industry verticals; sort by provider/API count.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listIndustries
- name: get_industry
  description: 'One industry: metadata + a top sample of its member providers (ranked, with the total).
    Use find_providers?industry=slug for the full list, or view=full here. Results carry `next`: the sub-resources
    that exist for this entity and the exact tool call that retrieves each, computed from this record.
    Pass include_next=false to omit it.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getIndustry
- name: find_estates
  description: UNDERSTANDING — Browse corporate estates — one COMPANY whose API surface is spread across
    many provider records (Amazon 237, Salesforce 27, Cisco 37). Ranked by member count. Use this when
    two slugs look like separate vendors and you need to know whether they are one company. Priced B1
    (single-entity synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence.
    See apis://prices.
- name: get_estate
  description: 'UNDERSTANDING — One estate: the owning provider, the full member roster with per-member
    API counts and bands, and the estate-wide rating. Use get_provider_estate(slug) to go the other way,
    from a provider to the company that owns it. Priced B1 (single-entity synthesis) — $0.01 per call
    under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
- name: get_provider_estate
  description: Which corporate estate a provider belongs to, if any. Answers 200 with estate:null when
    the provider stands alone — that is a measured absence, not a missing record.
- name: find_regions
  description: Browse geographic regions; sort by provider/API count. Returns the 18 regions themselves.
    The collection also holds region x industry crossover pages (nordics-healthcare and 1,097 more); those
    are excluded unless you ask for them with type.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listRegions
- name: get_region
  description: 'One region: metadata + a top sample of its member providers (ranked, with the total).
    Use find_providers?region=slug for the full list, or view=full here. Results carry `next`: the sub-resources
    that exist for this entity and the exact tool call that retrieves each, computed from this record.
    Pass include_next=false to omit it.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getRegion
- name: find_countries
  description: 'Browse the country dimension — the finest of the four place taxonomies, and the one a
    buyer usually names ("who is in Germany"). Peer to find_industries / find_regions / find_areas. Search
    by text; sort by provider count. Membership is derived and known to be partial: read a count as a
    floor, not a census.'
  first_seen: '2026-09-11'
- name: get_country
  description: 'One country: metadata, counts, and a top sample of member providers (with the total).
    Use find_providers?country=slug for the full ranked list, or view=full here.'
  first_seen: '2026-09-11'
- name: find_areas
  description: Browse the API Evangelist areas taxonomy (authentication, webhooks, payments, …) — curated,
    scored provider indexes. Search by text; sort by provider count.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listAreas
- name: get_area
  description: 'One area: metadata, its dedicated site link, and a top sample of member providers (with
    the total). Use find_providers?area=slug for the full list, or view=full here. Results carry `next`:
    the sub-resources that exist for this entity and the exact tool call that retrieves each, computed
    from this record. Pass include_next=false to omit it.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getArea
- name: find_regulations
  description: Browse the laws, statutes and accreditations the catalog tracks, each joined to the countries,
    regions and industries it binds. Filter by scope=horizontal to get the regimes that reach a provider
    with NO industry tag at all, which is the question tags alone cannot answer; or by kind (regulation/statute/accreditation/regulator-guidance)
    or jurisdiction. A null company_count means the job-corpus pass has not run for that name — it is
    NOT a measured zero.
- name: get_regulation
  description: 'One regulation: what it is, its jurisdiction and scope, a link to the law itself, and
    reaches[] — the country, region and industry cohorts this regime binds. Use reaches[] to go straight
    to the affected members with find_providers.'
- name: find_extensions
  description: 'Browse every OpenAPI `x-` specification extension harvested across the catalog, with the
    provenance the OpenAPI Initiative registry does not carry: who publishes it, in how many documents,
    where in the document it appears, and what shape the value takes. Search by key or purpose; sort by
    occurrences.'
  first_seen: '2026-09-11'
- name: get_extension
  description: 'One OpenAPI specification extension: its publishers, occurrence and document counts, where
    it appears, and the value shapes observed. CHECK is_api_evangelist BEFORE treating a key as provider-originated
    — some of these are published by API Evangelist, not by a vendor.'
  first_seen: '2026-09-11'
- name: find_ratings
  description: Ranked ratings leaderboard — filter by band, score range, trend, or facet threshold. Sort
    by composite (default), delta (biggest gainers), or any quality facet (governance, security, …) to
    rank providers by that dimension. Priced per result — $0.005 per request plus $0.0002 per record returned
    (less past 100), capped at $0.50 a request, under pay-as-you-go; included in Understanding and Influence.
    Estimate first at /api/v1/prices/estimate. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#listRatings
- name: get_provider_rating
  description: One provider's full rating breakdown (composite, band, trend, six facets). Priced B1 (single-entity
    synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getProviderRating
- name: find_cohorts
  description: START HERE for market-level questions. Every scored population of providers in the catalog
    — tags, industries, regions, areas and VC portfolios — as one browsable index. Filter by kind, minimum
    population, or promotion tier (report/brief/data). Then call cohort_stats for the distribution, cohort_rankings
    for the leaderboard. Priced per result — $0.005 per request plus $0.0002 per record returned (less
    past 100), capped at $0.50 a request, under pay-as-you-go; included in Understanding and Influence.
    Estimate first at /api/v1/prices/estimate. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#listCohorts
  first_seen: '2026-09-11'
- name: get_cohort
  description: 'One cohort: its identity, its population, and the full member roster with each provider''s
    Kin Score and agent readiness. Understanding plan. The analysis parts (stats/rankings/scores/capabilities)
    are Understanding too — they moved down from Influence on 2026-09-01. Priced per result — $0.005 per
    request plus $0.0002 per record returned (less past 100), capped at $0.50 a request, under pay-as-you-go;
    included in Understanding and Influence. Estimate first at /api/v1/prices/estimate. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#getCohort
  first_seen: '2026-09-11'
- name: find_tag_groups
  description: 'START HERE for capability-map questions. The 1,500+ tag groups the catalog computes —
    sets of tags that demonstrably travel together across providers (Cards, Logistics, Wealth Management,
    Observability), the layer between a single tag and a coarse facet. Every response carries a `coverage`
    block: about a quarter of the vocabulary is in NO group, and any count taken from here should be read
    against `ungrouped_share`. Pass exclude=cross_cutting,sparse to drop the groups that are plumbing
    rather than markets.'
  first_seen: '2026-09-11'
- name: get_tag_group
  description: 'One tag group: its member tags and the full provider roster resolved from the catalog,
    each with Kin Score and agent readiness. Filter the roster by industry, region, country or area. Free;
    the DISTRIBUTION over the roster (`stats`) needs Understanding. Note `source_provider_count` vs `provider_count`
    — the first comes from an index that caps band membership at 1,000, the second is resolved live and
    is the complete number.'
  first_seen: '2026-09-11'
- name: tag_group_tags
  description: The member tags of one tag group, each joined to its catalog record — provider count, api
    count, tag quality band and composite. Use it to see what a group is actually made of before trusting
    the group as a market. Priced B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go; included
    in Understanding and Influence. See apis://prices.
  first_seen: '2026-09-11'
- name: cohort_stats
  description: 'UNDERSTANDING — the DISTRIBUTION for a whole market: Kin Score mean/median/min/max/stdev,
    agent-readiness spread, band split, per-facet averages, and artifact adoption rates. This is the market-stats
    sheet from a Trend Report, computed live. Always carries a `coverage` block saying how much of the
    roster is actually scored AND how deeply we enriched it (`enrichment_depth`: mean catalog_gap and
    median artifact directories). Read that before quoting the mean anywhere: cohort enrichment depth
    spans ~42 points of catalog_gap across the catalog, so part of any cohort number is our coverage rather
    than the market. Priced B2 (cross-catalog synthesis) — $0.05 per call under pay-as-you-go; included
    in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#getCohortStats
  first_seen: '2026-09-11'
- name: cohort_rankings
  description: 'UNDERSTANDING — the leaderboard for a market, on TWO axes: rank by Kin Score composite
    AND rank by agent readiness. The two orders differ, and the gap between a provider''s two ranks is
    usually the story. Priced per result — $0.005 per request plus $0.0002 per record returned (less past
    100), capped at $0.50 a request, under pay-as-you-go; included in Understanding and Influence. Estimate
    first at /api/v1/prices/estimate. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#getCohortRankings
  first_seen: '2026-09-11'
- name: cohort_scores
  description: UNDERSTANDING — facet-level scores for every member of a cohort, each with the cohort average
    and the delta against it. A 60 in governance means nothing until you know the market sits at 45; this
    is the endpoint that says so. Priced per result — $0.005 per request plus $0.0002 per record returned
    (less past 100), capped at $0.50 a request, under pay-as-you-go; included in Understanding and Influence.
    Estimate first at /api/v1/prices/estimate. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#getCohortScores
  first_seen: '2026-09-11'
- name: find_operations
  description: 'UNDERSTANDING — CATALOG-WIDE operation search: which providers expose a path matching
    your terms. "Who has a POST /refunds" had no answer before this — tags are what a company says about
    itself, a path is what its API accepts. Terms match path SEGMENTS (all must appear), so q="payment
    intents" finds /payments/v1/intents. Add method to narrow by verb, deprecated=true for the retiring
    ones. One row per real operation: a provider''s spec is split per tag, so the same call can live in
    several of its documents, and `apis` lists them all. Reads matching providers'' surfaces up to max_providers
    (cap 100) and tells you in `meta.query.truncated` when more matched than were read. Priced per result
    — $0.005 per request plus $0.0002 per record returned (less past 100), capped at $0.50 a request,
    under pay-as-you-go; included in Understanding and Influence. Estimate first at /api/v1/prices/estimate.
    See apis://prices.'
  first_seen: '2026-09-11'
- name: deprecated_operations
  description: 'UNDERSTANDING — every provider publishing at least one operation marked deprecated in
    its own OpenAPI, ranked by how many. The lifecycle view of the catalog: 8,297 deprecated operations
    across 681 providers, which nothing could see before, because a provider''s own deprecated filter
    needs you to already suspect that provider. Drill in with get_provider_operations(deprecated=true).
    Priced per result — $0.005 per request plus $0.0002 per record returned (less past 100), capped at
    $0.50 a request, under pay-as-you-go; included in Understanding and Influence. Estimate first at /api/v1/prices/estimate.
    See apis://prices.'
  first_seen: '2026-09-11'
- name: cohort_history
  description: 'UNDERSTANDING — the SET-LEVEL time series: how a whole market''s Kin Score and agent readiness
    moved, build by build. There was a per-provider series and a whole-dataset licence and nothing between
    them, so "how has banking moved over six months" had no answer. Returns the MEAN over members present
    on each date plus members_scored beside it — membership changes as the catalog grows, and a move you
    cannot attribute to scores rather than population is not a finding. Priced B2 (cross-catalog synthesis)
    — $0.05 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: cohort_failures
  description: 'UNDERSTANDING — what a whole market gets WRONG: the agent-readiness checks its members
    most commonly fail, ranked by what fixing each would move the cohort mean. The inverse of gap_analysis,
    which says where a market is under-served; this says where it is failing the rubric. Turns "fix your
    OpenAPI" into "this industry does not publish OpenAPI", which is the shape of a finding worth publishing.
    Named checks only — facet rollups cannot name the checks underneath them. Priced per result — $0.005
    per request plus $0.0002 per record returned (less past 100), capped at $0.50 a request, under pay-as-you-go;
    included in Understanding and Influence. Estimate first at /api/v1/prices/estimate. See apis://prices.'
  first_seen: '2026-09-11'
- name: cohort_capabilities
  description: 'UNDERSTANDING — what every member of a cohort actually publishes: artifact counts by type
    plus the agent-readiness dimensions each one satisfies. The capability matrix behind a market report.
    Large cohorts come back in byte-budgeted chunks: while `complete` is false, call again with `cursor`
    set to `next_cursor`; the last page has `complete: true` and a null `next_cursor`. Priced B2 (cross-catalog
    synthesis) — $0.05 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#getCohortCapabilities
  first_seen: '2026-09-11'
- name: compare_cohorts
  description: 'UNDERSTANDING — two markets side by side on one rubric: "is US payments further along
    than UK banking?" Returns both distributions plus the deltas on score, agent readiness, every facet
    and every adoption rate. A question a written report cannot answer, because a report only ever covers
    one market. CHECK `depth_confounded` FIRST: when the higher-scoring cohort is also the one we enriched
    more deeply, the delta reflects our own coverage as much as the markets, and `depth_note` says by
    how much. Priced per result — $0.005 per request plus $0.0002 per record returned (less past 100),
    capped at $0.50 a request, under pay-as-you-go; included in Understanding and Influence. Estimate
    first at /api/v1/prices/estimate. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-cohorts-openapi.yml#compareCohorts
  first_seen: '2026-09-11'
- name: get_provider_operations
  description: Every operation a provider exposes, across all of its OpenAPIs — method, path, operationId,
    summary, which API it belongs to, and whether it is deprecated. The shortcut for "what can I actually
    call here?", which otherwise means fetching and parsing every one of their specs. Where the provider
    publishes agentic-access, each operation also carries its action class and CONSEQUENCE (read vs something
    that moves money) — filter on those to find the safe surface before letting an agent loose on it.
  source_operation: openapi/_original/apis-io-v1-providers-openapi.yml#getProviderOperations
  first_seen: '2026-09-11'
- name: get_provider_tools
  description: 'Every MCP tool a provider ships, with the operation each one wraps and its auth. Reports
    provenance per tool: `first-party` means the provider publishes that server, `derived` means API Evangelist
    generated a candidate tool list from their OpenAPI because no hosted server was found. Filter with
    provenance=first-party for a true picture — counting derived tools as the provider''s own overstates
    MCP adoption badly. A server whose tools could not be enumerated (auth-gated) is reported in coverage.not_enumerable
    rather than silently counted as zero.'
  source_operation: openapi/_original/apis-io-v1-providers-openapi.yml#getProviderTools
  first_seen: '2026-09-11'
- name: get_provider_schema
  description: Every JSON Schema a provider publishes — the data shapes their API works in, in one list,
    without walking their artifacts. Free.
  source_operation: openapi/_original/apis-io-v1-providers-openapi.yml#getProviderSchema
  first_seen: '2026-09-11'
- name: get_provider_facets
  description: UNDERSTANDING — one provider's score broken into its facets (discoverability, contract
    quality, governance, operational transparency, developer ergonomics, commercial clarity) plus any
    regulatory regime that applies. The composite is one number; these are the parts a team can actually
    act on. Priced B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go; included in Understanding
    and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-ratings-openapi.yml#getProviderFacets
  first_seen: '2026-09-11'
- name: get_agent_readiness
  description: EXPLORE — the agent-readiness dimensions and standalone score for ONE provider (spec presence,
    MCP server, auth clarity, idempotency, error semantics, rate-limit signal, well-known catalog, consent
    identity, dry-run…). A STANDALONE score, not a slice of the composite. For the same question across
    the catalog — who is agent-ready, which dimensions have actually diffused — use find_agent_readiness
    (Influence). Priced B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go; included in
    Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-ratings-openapi.yml#getProviderAgentReadiness
  first_seen: '2026-09-11'
- name: find_agent_readiness
  description: UNDERSTANDING — the agent-readiness leaderboard across the whole catalog. Rank providers
    by agent readiness, and filter to those that DO satisfy (has) or do NOT satisfy (missing) specific
    dimensions — e.g. has="mcp_server,protected_resource_metadata" is the OAuth-capable MCP cohort, missing="agent_card"
    is the addressable market for a fix. Returns agent score + band alongside the Kin Score. Priced per
    result — $0.005 per request plus $0.0002 per record returned (less past 100), capped at $0.50 a request,
    under pay-as-you-go; included in Understanding and Influence. Estimate first at /api/v1/prices/estimate.
    See apis://prices.
  first_seen: '2026-09-11'
- name: agent_readiness_dimensions
  description: 'UNDERSTANDING — diffusion: for each agent-readiness dimension, how many scored providers
    satisfy it, out of how many, as a share. The denominator every "the agent web is/is not here yet"
    claim needs and almost never has. Priced B1 (single-entity synthesis) — $0.01 per call under pay-as-you-go;
    included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: find_capabilities
  description: 'START HERE for "what can a business do with these APIs". The business-capability model
    — 333 top-level capabilities across 28 industries — with how many catalog providers reach each one.
    Defaults to capabilities the catalog actually reaches; pass all=true for the whole model INCLUDING
    the ones with no coverage, which is a real answer rather than a gap: most of what an enterprise does
    runs on internal systems that publish no API. Free. Priced per result — $0.005 per request plus $0.0002
    per record returned (less past 100), capped at $0.50 a request, under pay-as-you-go; included in Understanding
    and Influence. Estimate first at /api/v1/prices/estimate. See apis://prices.'
  first_seen: '2026-09-11'
- name: get_capability
  description: 'One business capability: its definition, its sub-capabilities, the external authorities
    it cites, WHICH catalog providers reach it with their ratings, and what it COSTS — `economics` carries
    how many suppliers publish a price and how opaque the market is (free), and for Understanding the
    entry-cost (USD/month) and marginal-cost (USD per unit, by unit) quartiles, take rate, pricing-basis
    mix, delivery mix and open-source alternatives, every figure graded A–D by how it was read. Accepts
    a slug or a BC id (e.g. "payments-card-management" or "BC-1340"). The per-tag edges WITH their evidence
    are get_capability_edges (Understanding). Priced per result — $0.005 per request plus $0.0002 per
    record returned (less past 100), capped at $0.50 a request, under pay-as-you-go; included in Understanding
    and Influence. Estimate first at /api/v1/prices/estimate. See apis://prices.'
  first_seen: '2026-09-11'
- name: get_capability_edges
  description: 'UNDERSTANDING — the evidence behind a capability. Every edge that lands on it: the provider,
    the tag, the exact OpenAPI file, a calibrated confidence, and the QUOTED FRAGMENT OF THE PROVIDER''S
    OWN CONTRACT that justifies the claim. Only edges at confidence >= 0.7 whose evidence was found verbatim
    in the source contract are published, so an edge here is checkable rather than asserted. This is what
    you cite when someone asks "says who?". Understanding plan. Priced B1 (single-entity synthesis) —
    $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  first_seen: '2026-09-11'
- name: get_provider_business_capabilities
  description: UNDERSTANDING — what ONE vendor's published APIs let a business DO, rolled up by capability,
