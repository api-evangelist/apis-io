  source_operation: openapi/_original/apis-io-v1-openapi.yml#compareProviders
- name: gap_analysis
  description: 'UNDERSTANDING — For each provider: high-value artifacts it lacks (MCP, Arazzo, Rules,
    Skills…), what its peers commonly publish but it lacks, and its score vs the peer median — plus stack-level
    gaps across the set. Priced B2 (cross-catalog synthesis) — $0.05 per call under pay-as-you-go; included
    in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#gapAnalysis
- name: whats_changed
  description: 'UNDERSTANDING — What changed in the catalog since a date: providers added/updated, plus
    rating movement measured FROM THAT DATE — each provider''s current score against its score at the
    first scored snapshot on or after `since`, with `was` and `compared_to` on every row. `basis` says
    whether the answer came from the recorded history or (when no snapshot covers the date) from last-build
    trend. Priced per result — $0.005 per request plus $0.0002 per record returned (less past 100), capped
    at $0.50 a request, under pay-as-you-go; included in Understanding and Influence. Estimate first at
