    is the full summary; pass `type` (e.g. OpenAPI, MCP) to scope the artifacts list to one type, since
    an unfiltered provider can be 250+ entries.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getProviderArtifacts
- name: get_api_artifacts
  description: 'One API''s artifacts grouped by type (by_type_counts is the full summary); pass `type`
    to scope the list to one type (synonym-aware: MCP matches MCPServer), include=["content"] to inline
    the bodies.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getApiArtifacts
- name: get_openapi
  description: An API's primary OpenAPI reference (url) — the top agent intent; set include=["content"]
