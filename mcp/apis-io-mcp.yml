    pay-as-you-go; included in Understanding and Influence. See apis://prices.
  first_seen: '2026-09-11'
- name: get_provider_capabilities
  description: 'What one provider publishes, counted by artifact type, with the agent dimensions it satisfies.
    Free — it is a fact about their own public surface. NOTE: this is artifact counts, NOT business capabilities
    — for what the vendor lets a business DO, call get_provider_business_capabilities. Priced B1 (single-entity
    synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-providers-openapi.yml#getProviderCapabilities
  first_seen: '2026-09-11'
- name: get_provider_evidence
  description: 'How a provider''s score was established, part by part: first-party (they published it),
