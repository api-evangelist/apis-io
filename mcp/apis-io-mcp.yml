    synthesis) — $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.'
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getRatingRubric
- name: find_artifacts
  description: 'Find artifacts of ANY one type across the catalog — the cross-type entry point. Each type
