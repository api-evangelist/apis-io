  source_operation: openapi/_original/apis-io-v1-openapi.yml#findSimilarProviders
- name: find_similar_apis
  description: APIs similar to a given one ("more like this") by shared tags.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#findSimilarApis
- name: get_industry_leaders
  description: UNDERSTANDING — Top-rated providers in an industry vertical. Priced B1 (single-entity synthesis)
    — $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getIndustryLeaders
- name: get_region_leaders
  description: UNDERSTANDING — Top-rated providers in a region. Priced B1 (single-entity synthesis) —
    $0.01 per call under pay-as-you-go; included in Understanding and Influence. See apis://prices.
  source_operation: openapi/_original/apis-io-v1-openapi.yml#getRegionLeaders
- name: get_country_leaders
  description: UNDERSTANDING — Top-rated providers in one country. Membership is derived and partial,
