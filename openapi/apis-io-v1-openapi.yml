  /enrich:
    get:
      operationId: enrichProvider
      x-mcp-tool: enrich_provider
      tags:
      - Resolve & Enrich
      summary: Enrich a provider in one call, choosing field groups.
      description: 'Resolves a slug OR any identifier and returns exactly the requested field groups, instead of
        chaining several `get_provider*` calls. Groups `profile`, `onboarding`, `artifacts` are free; `rating` and
        `insights` require the Pro tier (returned as `{ gated: true }` for free callers).'
      parameters:
      - name: id
        in: query
        required: true
        description: Provider slug or any identifier `/resolve` accepts.
        schema:
          type: string
      - name: fields
        in: query
        description: 'Comma-separated field groups: profile, onboarding, artifacts, rating, security, insights.
          Default: profile,onboarding,artifacts,rating.'
        schema:
          type: string
      responses:
        '200':
          description: The requested field groups for the provider.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
