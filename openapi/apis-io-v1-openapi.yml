openapi: 3.1.0
info:
  title: APIs.io API
  version: 1.6.0
  summary: Read-only discovery API over the APIs.io catalog of providers, APIs, tags, artifacts, and curated dimensions
    — with a free discovery tier and a Pro synthesis tier.
  description: "A first-class, read-only discovery API over the [APIs.io](https://apis.io) network.\n\nThe catalog\
    \ is assembled from per-provider repositories and exposed here as the\n**providers**, **apis**, and **tags**\
    \ resources, a **first-class collection per\nartifact type** (`/openapis`, `/asyncapis`, `/arazzo`, `/postman`,\
    \ `/json-schemas`, …),\nand a unified `/search` endpoint that spans them.\n\nDesign notes:\n- **Identifiers.**\
    \ `aid` is the stable id. A provider is `twilio`; an API is\n  `twilio:twilio-accounts-api` (`<provider>:<api-slug>`).\n\
    - **Artifacts by reference.** API records carry a `properties` list of artifacts\n  (`type` + `url`). By default\
    \ only references are returned; pass `include=content`\n  to inline an artifact's body.\n- **Selectable artifacts.**\
    \ Use `artifact_types` to return only the artifact types\n  you care about (e.g. `OpenAPI,Postman`).\n- **Free,\
    \ Pro, and Business tiers.** Raw discovery — `/search`, `/providers`, `/apis`, `/tags`,\n  the curated taxonomy\
    \ dimensions (`/industries`, `/regions`, `/areas`), `/resolve`, `/enrich`,\n  `/vcs`, `/insights`, and most\
    \ artifact-type collections (`/openapis`, `/mcp`, `/skills`,\n  `/examples`, `/json-schemas`, …) — is **free**.\
    \ The rating **data** (`/ratings`,\n  `/providers/{slug}/rating`), the ranked `…/leaders` views within a dimension,\
    \ the synthesis\n  composites (`/compare`, `/gaps`, `/changes`), the per-company insight depth, the saved\n\
    \  workspace (`/me/*`), and the high-value security artifact collections (`/scopes`, `/security`)\n  are **Pro**.\
    \ `/stack` is freemium: free callers get the top pick per capability, Pro gets the\n  full blueprint and `/stack/export`.\
    \ Bulk dataset pulls (`/export`) are **Business**, the\n  license tier above Pro. Each operation declares its\
    \ tier via `x-tier`; the rubric\n  (`/ratings/rubric`) stays free. Send `X-API-Key` for a paid tier; keyless\
    \ callers get the free\n  tier. A gated call returns **402 Payment Required** (not 403 — CloudFront rewrites\
    \ 403/404).\n  See `x-apis-io` for the full tier / MCP-tool / skill map.\n- **Also an MCP server + Agent Skills.**\
    \ Every operation maps 1:1 to an MCP tool at\n  `https://apis.io/mcp` (see each operation's `x-mcp-tool`) and,\
    \ where one exists, an\n  Agent Skill (`x-agent-skill`). This is the API → MCP → Agent-Skill experience chain.\n"
  contact:
    name: API Evangelist
    url: https://apis.io
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  x-logo:
    url: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
x-apis-io:
  tiers:
    free:
      label: Free
      description: Raw discovery — search, providers, apis, tags, and most artifact-type collections. Keyless.
    pro:
      label: Pro
      description: Curated dimensions (industries/regions/areas), rating data, synthesis composites, and the scopes/security
        artifact collections. Requires X-API-Key.
      plans: https://apis.io/developer/plans/
  mcp:
    endpoint: https://apis.io/mcp
    serverCard: https://apis.io/.well-known/mcp/server-card.json
  agentSkills:
    index: https://apis.io/.well-known/agent-skills/index.json
  prompts:
  - name: find_api
    tier: free
    description: Find an API for a task or use case, ranked with links.
    uses:
    - apis_io_search
  - name: explain_artifact
    tier: free
    description: Explain one API artifact (OpenAPI, AsyncAPI, Arazzo, rules, …) and how to use it.
    uses:
    - get_api
  - name: provider_overview
    tier: free
    description: Summarize what one provider offers — its APIs, artifacts, and links.
    uses:
    - get_provider
  - name: design_api_stack
    tier: pro
    description: PRO — Design a recommended API stack for a team, domain, or company, exportable as APIs.json.
    uses:
    - find_providers
    - apis_io_search
    - find_industries
    - find_ratings
    - recommend_stack
  - name: vendor_shortlist
    tier: pro
    description: PRO — Build a scored vendor shortlist for one capability, with tradeoffs.
    uses:
    - find_providers
    - apis_io_search
    - find_ratings
    - get_provider_rating
  - name: integrate_provider
    tier: free
    description: 'Onboard a provider end-to-end: pull the OpenAPI + onboarding, produce first-integration steps.'
    uses:
    - get_provider_onboarding
    - get_provider_artifacts
    - get_openapi
  - name: api_readiness_check
    tier: free
    description: Assess whether an API is ready to adopt — artifacts present, rating, what's missing.
    uses:
    - get_api_artifacts
    - get_provider_rating
  - name: audit_api_estate
    tier: pro
    description: PRO — Inventory, score, and gap a set of providers.
    uses:
    - compare_providers
    - gap_analysis
    - find_ratings
    - industry_gap_analysis
  - name: find_alternatives
    tier: pro
    description: PRO — Find and compare alternatives to a provider for a migration decision.
    uses:
    - find_similar_providers
    - compare_providers
    - get_provider_rating
  - name: build_agent_toolset
    tier: pro
    description: PRO — Assemble the providers, MCP servers, and skills an agent needs for a job.
    uses:
    - recommend_stack
    - find_artifacts
    - export_stack
  - name: track_provider_changes
    tier: pro
    description: PRO — Monitor a chosen set of providers for catalog and rating movement.
    uses:
    - whats_changed
    - find_rating_movers
    - get_rating_history
  resources:
  - uri: apis://catalog
    tier: free
    description: Service root — network-wide artifact counts.
  - uri: apis://ratings/rubric
    tier: free
    description: The scoring rubric — bands, facet weights, trend thresholds.
    operation: getRatingRubric
  - uri: apis://llms.txt
    tier: free
    description: The apis.io llms.txt index — a machine-readable map of the network for grounding.
  - uri: apis://provider/{slug}
    tier: free
    description: One provider's profile — its APIs and links.
    operation: getProvider
  - uri: apis://provider/{slug}/dossier
    tier: pro
    description: 'PRO — the full provider dossier: profile + every API + sampled artifact bodies, as one document.'
    operation: getProvider
  - uri: apis://provider/{slug}/openapi
    tier: free
    description: The provider's primary OpenAPI, inlined.
    operation: getOpenapi
  - uri: apis://tag/{slug}
    tier: free
    description: One tag with its linked providers, APIs, and neighbor tags.
    operation: getTag
  - uri: apis://industry/{slug}
    tier: pro
    description: PRO — an industry vertical with its ranked member providers.
    operation: getIndustry
  - uri: apis://region/{slug}
    tier: pro
    description: PRO — a region with its ranked member providers.
    operation: getRegion
  - uri: apis://area/{slug}
    tier: pro
    description: PRO — a curated area with its ranked member providers.
    operation: getArea
  - uri: apis://stack/{capabilities}
    tier: pro
    description: PRO — a designed capability stack exported as an adoptable APIs.json.
    operation: exportStack
  - uri: apis://changes
    tier: pro
    description: 'PRO — recent catalog changes (last 30 days): additions + rating movement, as a feed.'
    operation: whatsChanged
