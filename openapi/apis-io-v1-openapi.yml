servers:
- url: https://apis.io/api/v1
  description: Production server.
tags:
- name: Providers
  description: Organizations publishing APIs on the network.
- name: APIs
  description: Individual APIs, each owned by a provider and described by artifacts.
- name: Tags
  description: The tag taxonomy, with network-wide ranking metadata.
- name: Tag groups
  description: 'The layer between a tag and a facet: sets of tags that demonstrably travel together across providers,
    computed rather than curated.'
- name: Industries
  description: Industry verticals grouping providers across the catalog.
- name: Regions
  description: Geographic regions grouping providers across the catalog.
- name: Areas
  description: The API Evangelist areas taxonomy — curated topic collections (authentication, webhooks, payments,
    …), each a scored provider index with its own site. Pro.
- name: Synthesis
  description: Decision-grade composites over the catalog — provider comparison, gap analysis, catalog change feed,
    and recommended-stack design. Pro.
- name: Ratings
  description: The APIs.io API rating system — a 0–100 composite score, five bands, a trend marker, and six weighted
    facets measuring how complete, governed, and integration-ready each provider's public API surface is. Rubric
    v0.3.
- name: Cohorts
  description: Any scored population of providers — a tag, industry, region, area, or VC portfolio — with the distribution,
    rankings, facet scores, and capability matrix that a Trend or Portfolio Report is built from.
- name: Artifact Types
  description: First-class, per-type artifact collections (OpenAPI, AsyncAPI, Arazzo, Postman, JSON Schema, and
    more). Each path filters and normalizes one artifact type across all providers.
- name: Search
  description: Unified cross-resource search.
- name: Insights
  description: Demand-side intelligence — what ~5,800 companies (Fortune 1000 + API providers) build, buy, and hire
    for around APIs, data, and AI, derived from job postings, press, and engineering blogs. Discovery is free; per-company
    depth, gaps, and provider matches are Pro.
- name: Editorial
  description: Story leads mined from catalog movement (owner tier).
- name: Venture Capital
  description: Venture-capital firms as a first-class entity — fund identity plus a network-matched, rated PORTFOLIO
    GRAPH. Browse firms, walk a fund's portfolio (filter to API providers / by rating band), and follow the reverse
    edge from a provider to the VCs that back it. Free discovery.
- name: Resolve & Enrich
  description: Agent ergonomics — resolve any identifier (domain, URL, GitHub org) to a provider, and enrich a provider
    in one call by choosing field groups. Free (the rating and insights enrichment groups are Pro).
- name: Saved Workspace
  description: A Pro dimension — per-user saved searches, lists, and net-new deltas. The same capability the MCP
    exposes as tools; turns apis.io from stateless lookup into a persistent research workspace. Requires an API
    key.
- name: Export
  description: Bulk data export — the license tier above Pro. The whole ratings or providers dataset in one pull,
    with the attribution string a published figure must carry. Business tier.
security:
- {}
- ApiKeyAuth: []
