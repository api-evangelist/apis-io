  /cohorts/compare:
    get:
      operationId: compareCohorts
      x-tier: pro
      x-mcp-tool: compare_cohorts
      security: []
      tags:
      - Cohorts
      summary: Two cohorts side by side (Pro).
      description: Both distributions on one rubric, plus the deltas on composite, agent readiness, every facet
        and every adoption rate. Pass each cohort as `<kind>:<slug>`. A question the report format cannot answer,
        because a report only ever covers one market.
      parameters:
      - name: a
        in: query
        required: true
        schema:
          type: string
        example: tag:payments
        description: First cohort as <kind>:<slug>.
      - name: b
        in: query
        required: true
        schema:
          type: string
        example: industry:banking
        description: Second cohort as <kind>:<slug>.
      responses:
        '200':
          description: Two cohorts side by side (Pro).
          content:
            application/json:
              schema:
                type: object
        '400': *id001
        '402': &id005
          $ref: '#/components/responses/UpgradeRequired'
        '404': &id002
          $ref: '#/components/responses/NotFound'
