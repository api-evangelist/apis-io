  /providers/{slug}/apis:
    get:
      operationId: listProviderApis
      tags:
      - Providers
      summary: List the APIs published by a provider.
      description: Returns a page of the APIs owned by one provider, optionally filtered by tags and required artifact types. Pass `include=content` to inline artifact bodies.
      parameters:
      - $ref: '#/components/parameters/ProviderSlug'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Match'
      - $ref: '#/components/parameters/ArtifactTypes'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the provider's APIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiList'
              example:
                meta:
                  total: 3
                  page: 1
                  limit: 2
                  pages: 2
                  query:
                    provider: xquik-api
                data:
                - aid: xquik-api:xquik-api-mcp-server
                  slug: xquik-api-mcp-server
                  name: Xquik API MCP Server
                  description: Hosted MCP server for the Xquik API with OAuth 2.1 and API-key access.
                  tags:
                  - MCP
                  - Agents
                  - Automation
                  provider_slug: xquik-api
                  provider_name: Xquik
                  artifact_types:
                  - MCPServer
                  - ToolCrosswalk
                  - OAuthScopes
                  - Authentication
                  baseURL: https://xquik.com/mcp
                  humanURL: https://docs.xquik.com/mcp/overview
                  artifact_count: 0
