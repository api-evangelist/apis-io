                  slug: xquik-docs-mcp-server
                  name: Xquik Docs MCP Server
                  description: Read-only hosted MCP server for searching Xquik documentation.
                  tags:
                  - MCP
                  - Documentation
                  - Agents
                  provider_slug: xquik-api
                  provider_name: Xquik
                  artifact_types:
                  - MCPServer
                  - Documentation
                  baseURL: https://docs.xquik.com/mcp
                  humanURL: https://docs.xquik.com/mcp/overview
                  artifact_count: 0
          headers:
