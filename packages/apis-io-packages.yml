  Registry metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org, crates.io),
  api.github.com for the api-search organization, and https://apis.io/llms.txt
summary: >-
  APIs.io publishes NO first-party client SDK in any public package registry. That is the finding,
  and it is a real one rather than a gap in this probe: the service's own integration story is
  "call the REST contract, or attach the MCP server", and the only thing it actually distributes as
  an installable unit is a Claude Code plugin served from a GitHub repository, which has no
  registry and therefore no registry metadata endpoint to query. Every registry below was asked by
  name and answered.
packages:
- language: n/a
  registry: github
  distribution: claude-code-plugin
  name: apis-io
  marketplace: api-search/agent-skills
  url: https://github.com/api-search/agent-skills
  manifest: https://raw.githubusercontent.com/api-search/agent-skills/refs/heads/main/.claude-plugin/marketplace.json
  install: /plugin marketplace add api-search/agent-skills
  install_step_2: /plugin install apis-io@apis-io
  version: 1.0.0
  published: null
  official: true
  contents: 20 agent skills plus the APIs.io MCP server, in one install
  note: >-
    version 1.0.0 read from the plugin entry in the marketplace manifest (HTTP 200, fetched
    2026-09-11). published is null because a Claude Code plugin marketplace is a git repository,
    not a registry — there is no metadata endpoint that carries a publish date, and the manifest
    itself does not carry one. Checked, nothing to record; not unchecked.
  defect: >-
    https://apis.io/llms.txt tells an agent to run `/plugin marketplace add api-search/network`.
    That repository returns HTTP 404 to an anonymous caller — the marketplace actually lives at
    api-search/agent-skills. An agent following our own published instructions cannot install our
    own plugin. Verified 2026-09-11 against api.github.com/repos/api-search/network (404) and
    api.github.com/repos/api-search/agent-skills (200).
