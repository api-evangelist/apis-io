aid: apis-io
name: APIs.io
description: APIs.io is an open-source API search engine and federated discovery network built on the APIs.json specification.
  It indexes API providers and their individual APIs across the public internet along with the machine-readable artifacts
  they publish — OpenAPI, AsyncAPI, GraphQL, Arazzo workflows, Postman collections, JSON Schema, JSON-LD contexts, Spectral
  rulesets, vocabularies, OAuth scopes, plans, rate limits and FinOps profiles — and lets developers and agents search that
  catalog by keyword, capability, tag, industry, region, artifact type and quality band. As of August 2026 the network published
  roughly 26,414 providers, 109,100 APIs and 120,595 schemas across 71 industries and 77 curated areas. Every provider is
  scored with the Kin Score, a 0–100 composite across six weighted facets plus a standalone agent-readiness score. The same
  read-only OpenAPI 3.1 contract powers three surfaces — a REST API at https://apis.io/api/v1, a Streamable-HTTP MCP server
  at https://apis.io/mcp, and a set of published Agent Skills — alongside an RFC 9727 api-catalog linkset, an llms.txt and
  an APIs.json self-description. It is maintained by API Evangelist and serves both API producers submitting profiles and
  API consumers discovering APIs.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
